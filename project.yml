name: DropFrame
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  PythonKit:
    url: https://github.com/pvieito/PythonKit
    branch: main
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 23W7Z8WZ4F
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  DropFrame:
    type: application
    platform: iOS
    sources:
      - path: DropFrame
        excludes:
          - Resources/python-packages
    dependencies:
      - package: PythonKit
      - framework: Frameworks/Python.xcframework
        embed: true
    postBuildScripts:
      - name: Install Python Runtime
        script: sh "$PROJECT_DIR/scripts/install_python_runtime.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.DropFrame
        PRODUCT_NAME: DropFrame
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: DropFrame/Resources/Info.plist
    scheme:
      testTargets: []
